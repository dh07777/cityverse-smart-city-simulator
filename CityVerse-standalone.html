    <script>
        (function() {
                const CV = window.CV,
                    KEYS = ['pop', 'cong', 'dem', 'eff', 'aqi'];
                const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
                CV.bars = rows => rows.map(r => `<div class="row"><span>${r.l}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,r.v))}%;background:${r.c||''}"></i></div><em>${r.t}</em></div>`).join('');
                CV.Charts = {
                    line(c, S, o = {}) {
                        if (!c) return;
                        const d = devicePixelRatio || 1,
                            w = c.clientWidth,
                            h = c.clientHeight;
                        if (!w) return;
                        c.width = w * d;
                        c.height = h * d;
                        const x = c.getContext('2d');
                        x.scale(d, d);
                        const all = S.flatMap(s => s.d);
                        x.font = '10px system-ui';
                        x.fillStyle = css('--mut');
                        if (all.length < 2) {
                            x.fillText('Collecting data… press Start', 10, h / 2);
                            return
                        }
                        let mn = o.min != null ? o.min : Math.min(...all),
                            mx = o.max != null ? o.max : Math.max(...all);
                        if (mx <= mn) {
                            mx = mn + 1
                        }
                        if (o.min == null) {
                            const pd = (mx - mn) * .1;
                            mn -= pd;
                            mx += pd
                        }
                        x.strokeStyle = css('--line');
                        for (let k = 0; k < 3; k++) {
                            const y = 6 + k * (h - 24) / 2;
                            x.beginPath();
                            x.moveTo(0, y);
                            x.lineTo(w, y);
                            x.stroke()
                        }
                        x.fillText(mx >= 1000 ? Math.round(mx).toLocaleString() : mx.toFixed(1), 2, 14);
                        x.fillText(mn >= 1000 ? Math.round(mn).toLocaleString() : mn.toFixed(1), 2, h - 16);
                        if (o.labels) {
                            x.fillText(o.labels[0], 2, h - 3);
                            x.textAlign = 'right';
                            x.fillText(o.labels[1], w - 2, h - 3);
                            x.textAlign = 'left'
                        }
                        S.forEach(s => {
                            x.beginPath();
                            s.d.forEach((v, i) => {
                                const px = 4 + i * (w - 8) / (s.d.length - 1),
                                    py = 6 + (1 - (v - mn) / (mx - mn)) * (h - 24);
                                i ? x.lineTo(px, py) : x.moveTo(px, py)
                            });
                            x.strokeStyle = s.c;
                            x.lineWidth = 2;
                            x.stroke()
                        })
                    }
                };
                const g = (a, b, s) => Math.exp(-((a - b) ** 2) / (2 * s * s));
                const mk = (hr, k) => ({
                    pop: 40000 * (1 + (k - 30) * .0015),
                    cong: 35 * CV.curve.tr(hr) + 8 + 4 * Math.sin(k * 1.7 + hr),
                    dem: 87 * CV.curve.dem(hr) * (.95 + .08 * Math.sin(k)),
                    eff: 76 + 8 * Math.sin(k * .7 + hr / 5),
                    aqi: 55 + 25 * Math.sin(k * .5) + 20 * g(hr, 8, 2) + 15 * g(hr, 18, 2)
                });
                const MET = [
                    ['Population', 'pop', '#27d3ff'],
                    ['Traffic congestion %', 'cong', '#ffb83d'],
                    ['Energy demand (MW)', 'dem', '#ff7a45'],
                    ['Energy efficiency %', 'eff', '#2ee59d'],
                    ['Air quality (AQI)', 'aqi', '#ff4d6d']
                ];
                const A = CV.Analytics = {
                        hist: null,
                        acc: null,
                        range: 'd',
                        init() {
                            const s = CV.saved.hist;
                            if (s && s.h && s.d) this.hist = s;
                            else {
                                this.hist = {
                                    h: Array.from({
                                        length: 24
                                    }, (_, k) => mk((k + 9) % 24, 0)),
                                    d: Array.from({
                                        length: 30
                                    }, (_, k) => mk(12, k))
                                }
                            }
                            this.acc = null
                        },
                        sample() {
                            const S = CV.State,
                                a = this.acc = this.acc || {
                                    n: 0,
                                    pop: 0,
                                    cong: 0,
                                    dem: 0,
                                    eff: 0,
                                    aqi: 0
                                };
                            a.n++;
                            a.pop += S.pop;
                            a.cong += CV.Traffic.cong;
                            a.dem += CV.Energy.demand;
                            a.eff += CV.Energy.eff;
                            a.aqi += CV.Env.aqi;
                            if (S.t % 60 == 0) {
                                const r = {};
                                KEYS.forEach(k => r[k] = a[k] / a.n);
                                this.hist.h.push(r);
                                if (this.hist.h.length > 24) this.hist.h.shift();
                                this.acc = null;
                                if (S.t % 1440 == 0) {
                                    const d = {};
                                    KEYS.forEach(k => d[k] = this.hist.h.reduce((s, x) => s + x[k], 0) / this.hist.h.length);
                                    this.hist.d.push(d);
                                    if (this.hist.d.length > 30) this.hist.d.shift()
                                }
                            }
                        },
                        data() {
                            return this.range == 'd' ? this.hist.h : this.range == 'w' ? this.hist.d.slice(-7) : this.hist.d
                        },
                        panel(el) {
                            el.innerHTML = `<h3>📊 City Analytics</h3><div class="seg" id="an-r"><button data-r="d">Daily (24 h)</button><button data-r="w">Weekly</button><button data-r="m">Monthly</button></div>${MET.map((m,i)=>`<div class="card"><div class="row2"><small>${m[0]}</small><b id="an-v${i}"></b></div><canvas class="ch" id="an-c${i}"></canvas></div>`).join('')}`;
$('an-r').onclick=e=>{if(e.target.dataset.r){this.range=e.target.dataset.r;this.refresh()}}},
refresh(){if(!$('an-r'))return;document.querySelectorAll('#an-r button').forEach(b=>b.classList.toggle('on',b.dataset.r==this.range));const D=this.data(),lb=this.range=='d'?['24 h ago','now']:this.range=='w'?['7 days ago','today']:['30 days ago','today'];
MET.forEach((m,i)=>{const v=D.map(x=>x[m[1]]),l=v[v.length-1]||0;$('an-v'+i).textContent=m[1]=='pop'?Math.round(l).toLocaleString():l.toFixed(m[1]=='dem'?1:0);CV.Charts.line($('an-c'+i),[{d:v,c:m[2]}],{labels:lb})})}};
})();

    <script>
        (function() {
                const CV = window.CV,
                    M = CV.Map,
                    rnd = a => a[Math.random() * a.length | 0];
                const g = (a, b, s) => Math.exp(-((a - b) ** 2) / (2 * s * s));
                CV.curve = {
                    dem: h => .55 + .22 * g(h, 8, 2.2) + .32 * g(h, 19, 2.5),
                    tr: h => Math.min(1, .28 + .7 * g(h, 8, 1.8) + .75 * g(h, 17.5, 2) + .2 * g(h, 13, 3)),
                    wat: h => .6 + .55 * g(h, 7, 1.5) + .6 * g(h, 19, 2) + .2 * g(h, 13, 3),
                    sun: h => h > 6 && h < 18 ? Math.sin(Math.PI * (h - 6) / 12) : 0
                };
                CV.hour = () => (CV.State.t / 60) % 24;
                CV.clock = () => {
                    const t = CV.State.t,
                        m = t % 1440;
                    return `Day ${1+Math.floor(t/1440)} · ${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`
                };
                CV.alert = (l, m, k) => {
                    const S = CV.State;
                    if (k) {
                        if (S.ak[k] != null && S.t - S.ak[k] < 120) return;
                        S.ak[k] = S.t
                    }
                    S.alerts.unshift({
                        l,
                        m,
                        c: CV.clock(),
                        t: S.t
                    });
                    if (S.alerts.length > 40) S.alerts.length = 40
                };
                CV.kpis = () => {
                    const E = CV.Energy,
                        wp = 100 * CV.Water.level / CV.Water.CAP,
                        k = {
                            cong: CV.Traffic.cong,
                            deficit: E.deficit,
                            renew: E.renew,
                            water: wp,
                            aqi: CV.Env.aqi,
                            inc: CV.Emergency.incidents.length
                        };
                    k.score = Math.max(0, Math.min(100, Math.round(100 - .2 * k.cong - .12 * k.aqi - 60 * (E.demand ? E.deficit / E.demand : 0) - (wp < 30 ? (30 - wp) * .6 : 0) - k.inc * 3)));
                    return k
                };
                const ROWS = [
                    ['cong', 'Congestion %', -1, 0],
                    ['deficit', 'Power deficit MW', -1, 1],
                    ['renew', 'Renewable %', 1, 0],
                    ['water', 'Reservoir %', 1, 0],
                    ['aqi', 'AQI', -1, 0],
                    ['inc', 'Active incidents', -1, 0],
                    ['score', 'City score', 1, 0]
                ];
                const SCN = [{
                    id: 'rush',
                    n: '🚗 Rush-hour gridlock',
                    d: 'Traffic ×2.2 with higher emissions',
                    a(m) {
                        m.traffic = 2.2;
                        m.pol = 1.3
                    }
                }, {
                    id: 'heat',
                    n: '🔥 Heatwave',
                    d: 'Power ×1.35, water ×1.3, stronger sun',
                    a(m) {
                        m.demand = 1.35;
                        m.water = 1.3;
                        m.solar = 1.1;
                        m.pol = 1.15
                    }
                }, {
                    id: 'green',
                    n: '🌱 Green transition',
                    d: '+30% solar, 30% less traffic, 12 trees',
                    a(m) {
                        m.solar = 1.3;
                        m.traffic = .7;
                        m.pol = .7;
                        CV.cfg.trees += 12
                    },
                    r() {
                        CV.cfg.trees -= 12
                    }
                }, {
                    id: 'flood',
                    n: '🌊 Major flood',
                    d: 'Heavy rain, flooded streets, an accident',
                    a(m) {
                        m.rain = 1.8;
                        CV.Emergency.create('flood', ...rnd(M.roads), 3);
                        CV.Emergency.create('flood', ...rnd(M.roads), 2);
                        CV.Emergency.create('accident', ...rnd(M.roads), 2)
                    }
                }, {
                    id: 'ind',
                    n: '🏭 Industrial shutdown',
                    d: 'All factories go offline',
                    a(m) {
                        m.ind = 0
                    }
                }, {
                    id: 'burst',
                    n: '💧 Water main burst',
                    d: 'Three simultaneous leaks',
                    a(m) {
                        m.water = 1.1;
                        for (let k = 0; k < 3; k++) CV.Water.addLeak(...rnd(M.roads))
                    }
                }, {
                    id: 'black',
                    n: '🌑 Grid failure',
                    d: 'Two districts lose power',
                    a() {
                        CV.Energy.setOutage(0, true);
                        CV.Energy.setOutage(1, true)
                    },
                    r() {
                        CV.Energy.setOutage(0, false);
                        CV.Energy.setOutage(1, false)
                    }
                }];
                const S0 = () => ({
                    demand: 1,
                    solar: 1,
                    traffic: 1,
                    pol: 1,
                    water: 1,
                    rain: 1,
                    ind: 1
                });
                const Sim = CV.Sim = {
                        raf: 0,
                        acc: 0,
                        last: 0,
                        newState() {
                            CV.State = {
                                t: CV.saved.t || 480,
                                running: false,
                                mods: S0(),
                                scen: null,
                                alerts: [],
                                ak: {},
                                pop0: M.tiles.reduce((a, t) => a + t.pop, 0),
                                pop: 0
                            };
                            this.pop()
                        },
                        pop() {
                            const S = CV.State;
                            S.pop = Math.round(S.pop0 * (1 + S.t / 1440 * .0015))
                        },
                        init() {
                            this.newState();
                            CV.Traffic.init();
                            CV.Energy.init();
                            CV.Water.init();
                            CV.Emergency.init();
                            CV.Analytics.init();
                            CV.Env.init();
                            CV.Traffic.step();
                            CV.Energy.step(true);
                            this.btn()
                        },
                        btn() {
                            $('bPlay').textContent = CV.State.running ? '⏸ Pause' : '▶ Start';
                            $('bPlay').classList.toggle('on', CV.State.running);
                            $('speed').value = CV.cfg.speed
                        },
                        start() {
                            if (CV.State.running) return;
                            CV.State.running = true;
                            this.last = performance.now();
                            this.acc = 0;
                            this.raf = requestAnimationFrame(t => this.loop(t));
                            this.btn()
                        },
                        pause() {
                            CV.State.running = false;
                            cancelAnimationFrame(this.raf);
                            this.btn();
                            CV.save()
                        },
                        toggle() {
                            CV.State.running ? this.pause() : this.start()
                        },
                        reset() {
                            this.pause();
                            CV.saved = {
                                cfg: CV.cfg
                            };
                            CV.lastScen = null;
                            this.init();
                            M.sel = null;
                            $('insp').hidden = true;
                            CV.save();
                            CV.App.refresh();
                            M.draw();
                            CV.toast('Simulation reset')
                        },
                        setSpeed(v) {
                            CV.cfg.speed = +v;
                            CV.save();
                            this.btn()
                        },
                        loop(ts) {
                            if (!CV.State.running) return;
                            const rd = Math.max(0, Math.min(.1, (ts - this.last) / 1000)),
                                sp = CV.cfg.speed;
                            this.last = ts;
                            CV.Traffic.move(Math.min(.12, rd * sp));
                            this.acc += rd * sp;
                            let n = 0;
                            while (this.acc >= .5 && n++ < 6) {
                                this.acc -= .5;
                                this.step()
                            }
                            if (n >= 6) this.acc = 0;
                            M.draw();
                            this.raf = requestAnimationFrame(t => this.loop(t))
                        },
                        step() {
                            const S = CV.State;
                            S.t += 5;
                            this.pop();
                            CV.Traffic.step();
                            CV.Energy.step();
                            CV.Water.step();
                            CV.Env.step();
                            CV.Emergency.step();
                            this.random();
                            this.scen();
                            CV.Analytics.sample();
                            if (S.t % 60 == 0) CV.save();
                            CV.App.refresh()
                        },
                        random() {
                            if (!CV.cfg.random || Math.random() > .02) return;
                            const r = Math.random(),
                                E = CV.Energy;
                            if (r < .35) CV.Water.addLeak(...rnd(M.roads));
                            else if (r < .6) {
                                if (!E.out.some(x => x)) E.setOutage(Math.random() * 4 | 0, true, true)
                            } else {
                                const ty = rnd(['fire', 'accident', 'medical', 'flood']),
                                    t = rnd(M.tiles);
                                CV.Emergency.create(ty, t.i, t.j)
                            }
                        },
                        run(id) {
                            const S = CV.State;
                            if (S.scen) {
                                CV.toast('A scenario is already running');
                                return
                            }
                            const sc = SCN.find(x => x.id == id),
                                before = CV.kpis();
                            sc.a(S.mods);
                            S.scen = {
                                sc,
                                left: 48,
                                total: 48,
                                before,
                                sum: {},
                                n: 0
                            };
                            CV.alert('info', 'Scenario started: ' + sc.n);
                            this.start();
                            CV.App.show('scenario')
                        },
                        stop() {
                            const S = CV.State;
                            if (!S.scen) return;
                            this.fin(true)
                        },
                        scen() {
                            const s = CV.State.scen;
                            if (!s) return;
                            const k = CV.kpis();
                            for (const x in k) s.sum[x] = (s.sum[x] || 0) + k[x];
                            s.n++;
                            if (--s.left <= 0) this.fin()
                        },
                        fin(abort) {
                            const S = CV.State,
                                s = S.scen,
                                after = {};
                            for (const x in s.sum) after[x] = s.sum[x] / Math.max(1, s.n);
                            if (!s.n) Object.assign(after, CV.kpis());
                            S.mods = S0();
                            s.sc.r && s.sc.r();
                            S.scen = null;
                            CV.lastScen = {
                                name: s.sc.n,
                                before: s.before,
                                after,
                                impact: Math.round(after.score - s.before.score),
                                abort: !!abort
                            };
                            CV.alert('ok', 'Scenario finished: ' + s.sc.n);
                            CV.save();
                            CV.App.refresh()
                        },
                        panel(el) {
                            el.innerHTML = `<h3>🧪 Scenario Simulator</h3><div class="card"><div class="row2"><small>Simulation</small><div class="seg"><button class="btn" id="sc-go">▶ Start / pause</button><button class="btn" id="sc-rs">↺ Reset</button></div></div><small>Each scenario runs for 4 simulated hours, then compares before and after.</small></div><div id="sc-st"></div>${SCN.map(s=>`<div class="card"><div class="row2"><b>${s.n}</b><button class="btn" data-s="${s.id}">Run</button></div><small>${s.d}</small></div>`).join('')}<div id="sc-res"></div>`;
$('sc-go').onclick=()=>this.toggle();$('sc-rs').onclick=()=>this.reset();el.onclick=e=>{const id=e.target.dataset.s;if(id)this.run(id);if(e.target.id=='sc-stop')this.stop()}},
refresh(){if(!$('sc-st'))return;const s=CV.State.scen;$('sc-st').innerHTML=s?`<div class="card"><div class="row2"><b>Running: ${s.sc.n}</b><button class="btn" id="sc-stop">Stop</button></div><div class="bar"><i style="width:${100*(s.total-s.left)/s.total}%"></i></div></div>`:'';
const r=CV.lastScen;$('sc-res').innerHTML=r?`<div class="card"><b>Last result: ${r.name}</b>${r.abort?' <small>(stopped early)</small>':''}<div class="row2"><small>Impact score</small><b class="big ${r.impact<0?'bad':'ok'}">${r.impact>0?'+':''}${r.impact}</b></div><table><tr><th></th><th>Before</th><th>After</th><th>Δ</th></tr>${ROWS.map(([k,l,d,f])=>{const a=r.before[k],b=r.after[k],x=b-a,c=Math.abs(x)<.05?'':(x*d>0?'ok':'bad');return`<tr><td>${l}</td><td>${a.toFixed(f?1:0)}</td><td>${b.toFixed(f?1:0)}</td><td class="${c}">${x>0?'+':''}${x.toFixed(f?1:0)}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No scenario run yet. Pick one above to compare before and after.</div>'}};
})();
    </script>
    <script>
        (function() {
            const CV = window.CV;
            const NAV = [
                ['overview', '🏙️', 'Overview'],
                ['traffic', '🚦', 'Traffic'],
                ['energy', '⚡', 'Energy'],
                ['water', '💧', 'Water'],
                ['env', '🌿', 'Environment'],
                ['emergency', '🚨', 'Emergency'],
                ['analytics', '📊', 'Analytics'],
                ['scenario', '🧪', 'Scenarios'],
                ['settings', '⚙️', 'Settings']
            ];
            let cur = 'overview',
                MODS = {};
            const lv = (v, a, b) => v > b ? 'bad' : v > a ? 'warn' : 'ok';
            CV.toast = m => {
                const t = $('toast');
                t.textContent = m;
                t.classList.add('show');
                clearTimeout(CV._tt);
                CV._tt = setTimeout(() => t.classList.remove('show'), 2400)
            };
            const dl = (name, txt, type) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([txt], {
                    type
                }));
                a.download = name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 500)
            };
            CV.Overview = {
                panel(el) {
                    el.innerHTML = `<h3>🏙️ City Overview</h3><div class="card" style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 100 100" width="104" height="104"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(120,160,220,.25)" stroke-width="9"/><circle id="ov-ring" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="264" transform="rotate(-90 50 50)"/><text id="ov-sc" x="50" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">0</text></svg><div><b>City health score</b><br><small id="ov-pop"></small><br><small>Score blends traffic, air, power, water and incidents.</small></div></div>
<div class="card"><div class="row2"><b>Alerts</b><button class="btn" id="ov-clr">Clear</button></div><div id="ov-al"></div></div>
<div class="card"><b>Getting started</b><br><small>Press ▶ Start. Click any building or road to inspect it. Use the layer buttons on the map for traffic, pollution, power and water views. Drag to pan, scroll or pinch to zoom.</small></div>`;
                    $('ov-clr').onclick = () => {
                        CV.State.alerts = [];
                        CV.App.refresh()
                    }
                },
                refresh() {
                    if (!$('ov-sc')) return;
                    const k = CV.kpis(),
                        c = k.score > 70 ? 'var(--ok)' : k.score > 45 ? 'var(--warn)' : 'var(--bad)',
                        r = $('ov-ring');
                    r.style.stroke = c;
                    r.setAttribute('stroke-dashoffset', 264 * (1 - k.score / 100));
                    $('ov-sc').textContent = k.score;
                    $('ov-pop').textContent = 'Population ' + CV.State.pop.toLocaleString();
                    $('ov-al').innerHTML = CV.State.alerts.length ? CV.State.alerts.slice(0, 8).map(a => `<div class="al ${a.l}"><small>${a.c}</small>${a.m}</div>`).join('') : '<div class="empty">✅ All systems nominal. No alerts.</div>'
                }
            };
            CV.Settings = {
                panel(el) {
                    const c = CV.cfg;
                    el.innerHTML = `<h3>⚙️ Settings</h3><div class="card"><label>Theme<br><select id="st-th"><option value="dark">Midnight (dark)</option><option value="ocean">Ocean teal</option><option value="light">Daylight</option></select></label><label>Default simulation speed<br><select id="st-sp"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
<label><input type="checkbox" id="st-rn"> Random incidents (leaks, outages, emergencies)</label><label><input type="checkbox" id="st-ad"> Auto-dispatch emergency units</label><label><input type="checkbox" id="st-vh"> Show vehicles on map</label></div>
<div class="card"><small>Data</small><div class="seg"><button class="btn" id="st-ej">⬇ Export JSON</button><button class="btn" id="st-ec">⬇ Export analytics CSV</button></div><div class="seg"><button class="btn" id="st-tr">🎓 Replay tour</button><label class="btn" style="margin:0">⬆ Import JSON<input type="file" id="st-im" accept=".json" hidden></label></div><small>Shortcuts: Space start/pause · +/− zoom · L cycle layers · 1–9 open modules · Esc cancel</small><div class="seg"><button class="btn" id="st-rs">↺ Reset simulation</button><button class="btn" id="st-ra">🗑 Reset everything</button></div><small>Settings are saved in your browser's LocalStorage. Everything runs locally.</small></div>`;
                    $('st-th').value = c.theme;
                    $('st-sp').value = c.speed;
                    $('st-rn').checked = c.random;
                    $('st-ad').checked = c.autoDispatch;
                    $('st-vh').checked = c.showVehicles;
                    $('st-th').onchange = e => {
                        c.theme = e.target.value;
                        document.documentElement.dataset.theme = c.theme;
                        CV.Map.themeChanged();
                        CV.save()
                    };
                    $('st-sp').onchange = e => CV.Sim.setSpeed(e.target.value);
                    $('st-rn').onchange = e => {
                        c.random = e.target.checked;
                        CV.save()
                    };
                    $('st-ad').onchange = e => {
                        c.autoDispatch = e.target.checked;
                        CV.save()
                    };
                    $('st-vh').onchange = e => {
                        c.showVehicles = e.target.checked;
                        CV.save();
                        CV.Map.invalidate()
                    };
                    $('st-ej').onclick = () => dl('cityverse-export.json', JSON.stringify({
                        exported: new Date().toISOString(),
                        clock: CV.clock(),
                        cfg: c,
                        kpis: CV.kpis(),
                        population: CV.State.pop,
                        closedRoads: [...CV.Traffic.closed],
                        incidents: CV.Emergency.incidents,
                        leaks: CV.Water.leaks,
                        alerts: CV.State.alerts,
                        analytics: CV.Analytics.hist
                    }, null, 2), 'application/json');
                    $('st-ec').onclick = () => {
                        const K = ['pop', 'cong', 'dem', 'eff', 'aqi'],
                            rows = [
                                ['period', 'index', ...K].join(',')
                            ];
                        CV.Analytics.hist.h.forEach((x, i) => rows.push(['hourly', i, ...K.map(k => x[k].toFixed(2))].join(',')));
                        CV.Analytics.hist.d.forEach((x, i) => rows.push(['daily', i, ...K.map(k => x[k].toFixed(2))].join(',')));
                        dl('cityverse-analytics.csv', rows.join('\n'), 'text/csv')
                    };
                    $('st-rs').onclick = () => CV.Sim.reset();
                    $('st-tr').onclick = () => CV.tour();
                    $('st-im').onchange = e => {
                        const f = e.target.files[0];
                        if (!f) return;
                        f.text().then(t => {
                            try {
                                const o = JSON.parse(t);
                                if (!o.cfg) throw 0;
                                Object.assign(CV.cfg, o.cfg);
                                CV.save();
                                location.reload()
                            } catch (x) {
                                CV.toast('Not a valid CityVerse export')
                            }
                        })
                    };
                    $('st-ra').onclick = () => {
                        if (confirm('Delete all saved settings and data, then reload?')) {
                            CV.Storage.clear();
                            location.reload()
                        }
                    }
                },
                refresh() {}
            };
            const App = CV.App = {
                show(id) {
                    cur = id;
                    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id == 'p-' + id));
                    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.m == id));
                    if (innerWidth <= 900) {
                        document.body.classList.remove('navopen');
                        document.body.classList.add('panelopen')
                    } else document.body.classList.remove('pcol');
                    this.refresh()
                },
                refresh() {
                    $('clock').textContent = CV.clock();
                    this.kpi();
                    const m = MODS[cur];
                    m && m.refresh();
                    if (cur != 'overview') CV.Overview.refresh();
                    if (!CV.State.running) CV.Map.invalidate()
                },
                kpi() {
                    const S = CV.State,
                        E = CV.Energy,
                        wp = Math.round(100 * CV.Water.level / CV.Water.CAP),
                        n = S.alerts.filter(a => S.t - a.t < 180).length,
                        aq = CV.Env.aqi;
                    const k = [
                        ['overview', '👥 Population', S.pop.toLocaleString(), ''],
                        ['traffic', '🚦 Traffic', Math.round(CV.Traffic.cong) + '%', lv(CV.Traffic.cong, 40, 70)],
                        ['energy', '⚡ Energy', E.demand.toFixed(0) + ' / ' + (E.solar + E.conv).toFixed(0) + ' MW', E.deficit > .5 ? 'bad' : 'ok'],
                        ['water', '💧 Water', wp + '%', wp < 20 ? 'bad' : wp < 40 ? 'warn' : 'ok'],
                        ['env', '🌫️ AQI', aq, lv(aq, 100, 150)],
                        ['emergency', '🚨 Alerts', n, n > 3 ? 'bad' : n ? 'warn' : 'ok']
                    ];
                    $('kpis').innerHTML = k.map(x => `<button class="kpi ${x[3]}" data-m="${x[0]}"><small>${x[1]}</small><b>${x[2]}</b></button>`).join('')
                },
                place(m, i, j) {
                    const C = CV;
                    if (m == 'close') {
                        if (!C.Traffic.toggleClosure(i, j)) C.toast('Select a road tile');
                        return true
                    }
                    if (m == 'leak') {
                        C.Water.addLeak(i, j);
                        return false
                    }
                    if (m.startsWith('inc:')) {
                        C.Emergency.create(m.slice(4), i, j);
                        return false
                    }
                    return false
                },
                inspect(i, j) {
                    const M = CV.Map,
                        t = M.grid[j][i],
                        k = i + ',' + j;
                    M.sel = {
                        i,
                        j
                    };
                    let h;
                    if (t) {
                        h = `<b>${t.name}</b> <small>${t.type}</small><div class="kv">District: ${M.SEC[t.sector]}<br>Status: ${t.outage?'<span class=bad>Power outage</span>':'<span class=ok>Operational</span>'}<br>Power use: ${t.outage?0:(t.mw*CV.curve.dem(CV.hour())).toFixed(2)} MW${t.pop?'<br>Residents: '+t.pop.toLocaleString():''}<br>Local air index: ${Math.round(20+330*CV.Env.pol[j][i])}</div><div class="seg"><button class="btn" data-a="fire">🔥 Fire</button><button class="btn" data-a="med">🚑 Medical</button><button class="btn" data-a="out">⚡ ${t.outage?'Restore':'Cut'} power</button></div>`
                    } else {
                        const it = i % 3 == 0 && j % 3 == 0,
                            cl = CV.Traffic.closed.has(k);
                        h = `<b>${it?'Intersection':'Road'} (${i},${j})</b><div class="kv">Vehicles: ${(CV.Traffic.dens[k]||0).toFixed(1)}<br>Status: ${cl?'<span class=bad>Closed</span>':'<span class=ok>Open</span>'}${it?'<br>Signal: '+(CV.Traffic.sigAt(i,j)=='ns'?'North–South green':'East–West green'):''}</div><div class="seg"><button class="btn" data-a="close">${cl?'Reopen':'🚧 Close'}</button><button class="btn" data-a="leak">💧 Leak</button><button class="btn" data-a="acc">🚗 Accident</button></div>${it?'<div class="seg"><button class="btn" data-a="sns">N–S green</button><button class="btn" data-a="sew">E–W green</button><button class="btn" data-a="sau">Auto</button></div>':''}`
                    }
                    const p = $('insp');
                    p.innerHTML = '<div class="row2" style="float:right"><button class="ib" data-a="x">×</button></div>' + h;
                    p.hidden = false;
                    M.invalidate()
                }
            };

            function inspAct(e) {
                const a = e.target.dataset.a;
                if (!a) return;
                const M = CV.Map,
                    s = M.sel;
                if (a == 'x') {
                    M.sel = null;
                    $('insp').hidden = true;
                    M.invalidate();
                    return
                }
                if (!s) return;
                const {
                    i,
                    j
                } = s, t = M.grid[j][i], T = CV.Traffic;
                if (a == 'fire') CV.Emergency.create('fire', i, j);
                else if (a == 'med') CV.Emergency.create('medical', i, j);
                else if (a == 'out') CV.Energy.setOutage(t.sector, !CV.Energy.out[t.sector]);
                else if (a == 'close') T.toggleClosure(i, j);
                else if (a == 'leak') CV.Water.addLeak(i, j);
                else if (a == 'acc') CV.Emergency.create('accident', i, j);
                else if (a == 'sns' || a == 'sew' || a == 'sau') {
                    T.over[i + ',' + j] = a == 'sns' ? 'ns' : a == 'sew' ? 'ew' : 'auto';
                    CV.toast('Signal updated')
                }
                CV.App.inspect(i, j);
                CV.App.refresh()
            }
            CV.tour = () => {
                const S = [
                    ['Welcome to CityVerse', 'A living digital twin of a smart city. Everything is simulated locally in your browser.'],
                    ['Explore the map', 'Drag to pan, scroll or pinch to zoom. Click any building or road to inspect it and trigger events.'],
                    ['Control the city', 'Use the menu for traffic, energy, water, environment, emergencies, analytics and scenarios. Press Start or Space to run time.']
                ];
                let k = 0;
                const o = document.createElement('div');
                o.id = 'tour';
                document.body.appendChild(o);
                const end = () => {
                        o.remove();
                        CV.cfg.seen = 1;
                        CV.save()
                    },
                    r = () => {
                        o.innerHTML = `<div class="tc"><h3>${S[k][0]}</h3><p>${S[k][1]}</p><div class="row2"><small>${k+1} / ${S.length}</small><span class="seg"><button class="btn" id="t-s">Skip</button><button class="btn on" id="t-n">${k<2?'Next':'Start exploring'}</button></span></div></div>`;
                        $('t-s').onclick = end;
                        $('t-n').onclick = () => ++k < S.length ? r() : end()
                    };
                r()
            };
            window.addEventListener('DOMContentLoaded', () => {
                document.documentElement.dataset.theme = CV.cfg.theme;
                const P = $('panes'),
                    nv = $('nav');
                NAV.forEach(([id, ic, lb]) => {
                    const s = document.createElement('section');
                    s.className = 'pane';
                    s.id = 'p-' + id;
                    P.appendChild(s);
                    const b = document.createElement('button');
                    b.dataset.m = id;
                    b.textContent = ic + ' ' + lb;
                    nv.appendChild(b)
                });
                MODS = {
                    overview: CV.Overview,
                    traffic: CV.Traffic,
                    energy: CV.Energy,
                    water: CV.Water,
                    env: CV.Env,
                    emergency: CV.Emergency,
                    analytics: CV.Analytics,
                    scenario: CV.Sim,
                    settings: CV.Settings
                };
                CV.Sim.init();
                for (const id in MODS) MODS[id].panel($('p-' + id));
                nv.onclick = e => {
                    if (e.target.dataset.m) App.show(e.target.dataset.m)
                };
                $('kpis').onclick = e => {
                    const b = e.target.closest('.kpi');
                    if (b) App.show(b.dataset.m)
                };
                $('insp').onclick = inspAct;
                $('bPlay').onclick = () => CV.Sim.toggle();
                $('bReset').onclick = () => CV.Sim.reset();
                $('speed').onchange = e => CV.Sim.setSpeed(e.target.value);
                $('bNav').onclick = () => {
                    document.body.classList.remove('panelopen');
                    document.body.classList.toggle('navopen')
                };
                $('bPanel').onclick = () => {
                    if (innerWidth <= 900) {
                        document.body.classList.remove('navopen');
                        document.body.classList.toggle('panelopen')
                    } else document.body.classList.toggle('pcol')
                };
                $('pClose').onclick = () => document.body.classList.remove('panelopen');
                $('scrim').onclick = () => document.body.classList.remove('navopen', 'panelopen');
                $('ctlTog').onclick = () => document.body.classList.toggle('ctlopen');
                document.addEventListener('keydown', e => {
                    if (e.key == 'Escape') CV.Map.setMode(null);
                    const k = e.key;
                    if (!/INPUT|SELECT/.test(e.target.tagName)) {
                        if (k == '+' || k == '=') CV.Map.zoom(1.25);
                        if (k == '-') CV.Map.zoom(.8);
                        if (k == 'l' || k == 'L') {
                            const L = ['city', 'traffic', 'pollution', 'power', 'water'];
                            CV.Map.setLayer(L[(L.indexOf(CV.Map.layer) + 1) % 5])
                        }
                        if (k >= '1' && k <= '9') App.show(NAV[k - 1][0])
                    }
                    if (e.code == 'Space' && !/INPUT|SELECT|BUTTON/.test(e.target.tagName)) {
                        e.preventDefault();
                        CV.Sim.toggle()
                    }
                });
                $('zf').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
                CV.Map.init();
                App.show('overview');
                if (!CV.cfg.seen) CV.tour();
                if (innerWidth <= 900) document.body.classList.remove('panelopen');
                CV.Sim.btn()
            });
        })();
    </script>
