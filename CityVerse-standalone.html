<!doctype html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>CityVerse – Smart City Digital Twin Simulator</title>
    <style>
         :root {
            --bg: #070b14;
            --glass: rgba(12, 22, 42, .78);
            --line: rgba(80, 170, 255, .22);
            --tx: #dbe8ff;
            --mut: #8196b8;
            --ac: #27d3ff;
            --ok: #2ee59d;
            --warn: #ffb83d;
            --bad: #ff4d6d;
            --ground: #0c1526;
            --road: #1a2438
        }
        
        [data-theme=ocean] {
            --bg: #06141f;
            --glass: rgba(10, 38, 56, .78);
            --line: rgba(60, 220, 200, .25);
            --tx: #d8f5f2;
            --mut: #7fb3b3;
            --ac: #2de2c4;
            --ground: #0a2230;
            --road: #16384a
        }
        
        [data-theme=light] {
            --bg: #eaf0f8;
            --glass: rgba(255, 255, 255, .86);
            --line: rgba(30, 80, 160, .22);
            --tx: #14213d;
            --mut: #5a6b88;
            --ac: #0b7bd6;
            --ground: #dfe8f3;
            --road: #b9c6d8
        }
        
        * {
            box-sizing: border-box
        }
        
        html,
        body {
            height: 100%;
            margin: 0
        }
        
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
            overflow: hidden
        }
        
        #top {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            z-index: 30
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px
        }
        
        .logo span {
            color: var(--ac)
        }
        
        .clock {
            font-variant-numeric: tabular-nums;
            color: var(--ac);
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 20px;
            white-space: nowrap
        }
        
        .sp {
            flex: 1
        }
        
        .note {
            color: var(--mut);
            font-size: 11px
        }
        
        .btn,
        .ib,
        select {
            background: rgba(60, 130, 220, .14);
            color: var(--tx);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 7px 12px;
            font: inherit;
            cursor: pointer
        }
        
        .btn:hover,
        .ib:hover,
        select:hover {
            border-color: var(--ac)
        }
        
        .btn:focus-visible,
        .ib:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--ac)
        }
        
        .btn.on,
        .ib.on,
        .seg .on {
            background: var(--ac);
            color: #04121f;
            font-weight: 600
        }
        
        .mob {
            display: none
        }
        
        #app {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative
        }
        
        #nav {
            width: 150px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--glass);
            border-right: 1px solid var(--line);
            overflow: auto;
            z-index: 20
        }
        
        #nav button {
            background: none;
            border: 1px solid transparent;
            color: var(--tx);
            text-align: left;
            padding: 8px 10px;
            border-radius: 10px;
            font: inherit;
            cursor: pointer
        }
        
        #nav button:hover {
            background: rgba(60, 130, 220, .12)
        }
        
        #nav button.on {
            border-color: var(--ac);
            background: rgba(39, 211, 255, .12);
            color: var(--ac)
        }
        
        #stage {
            flex: 1;
            position: relative;
            min-width: 0;
            overflow: hidden
        }
        
        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab
        }
        
        #kpis {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            pointer-events: none
        }
        
        .kpi {
            pointer-events: auto;
            flex: 1;
            min-width: 104px;
            text-align: left;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 6px 10px;
            color: var(--tx);
            font: inherit;
            cursor: pointer
        }
        
        .kpi small {
            display: block
        }
        
        .kpi b {
            font-size: 16px
        }
        
        .kpi.ok b,
        .ok {
            color: var(--ok)
        }
        
        .kpi.warn b,
        .warn {
            color: var(--warn)
        }
        
        .kpi.bad b,
        .bad {
            color: var(--bad)
        }
        
        #mapctl {
            position: absolute;
            right: 10px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }
        
        #mapctl .ib {
            padding: 8px 11px;
            background: var(--glass)
        }
        
        #hint {
            position: absolute;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ac);
            color: #04121f;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            z-index: 5;
            white-space: nowrap
        }
        
        #hint button {
            margin-left: 8px;
            border: 0;
            border-radius: 10px;
            padding: 2px 8px;
            cursor: pointer
        }
        
        #tip {
            position: absolute;
            pointer-events: none;
            background: var(--glass);
            border: 1px solid var(--line);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 5
        }
        
        #insp {
            position: absolute;
            left: 10px;
            bottom: 12px;
            width: 290px;
            max-height: 46%;
            overflow: auto;
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px
        }
        
        #insp .seg {
            margin-top: 8px
        }
        
        .kv {
            margin: 6px 0;
            color: var(--mut);
            font-size: 13px
        }
        
        #panel {
            width: 390px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            border-left: 1px solid var(--line);
            transition: width .25s, margin .25s;
            z-index: 20;
            overflow: hidden
        }
        
        #panes {
            width: 390px;
            height: 100%;
            overflow: auto;
            padding: 12px
        }
        
        body.pcol #panel {
            width: 0;
            border: 0
        }
        
        .pane {
            display: none
        }
        
        .pane.active {
            display: block
        }
        
        h3 {
            margin: 2px 0 10px;
            font-size: 17px
        }
        
        .card {
            background: rgba(70, 130, 210, .08);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px
        }
        
        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px
        }
        
        .g2 .card {
            margin: 0
        }
        
        .big {
            font-size: 21px;
            font-weight: 700;
            display: block
        }
        
        small,
        .empty {
            color: var(--mut)
        }
        
        .empty {
            padding: 14px;
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 12px;
            margin-bottom: 10px
        }
        
        .bar {
            height: 8px;
            border-radius: 5px;
            background: rgba(120, 160, 220, .2);
            overflow: hidden
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            border-radius: 5px;
            transition: width .3s
        }
        
        .row {
            display: grid;
            grid-template-columns: 96px 1fr 64px;
            gap: 8px;
            align-items: center;
            margin: 6px 0;
            font-size: 12px
        }
        
        .row em {
            font-style: normal;
            text-align: right
        }
        
        .row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin: 4px 0
        }
        
        .seg {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0
        }
        
        .seg button {
            background: rgba(60, 130, 220, .14);
            color: var(--tx);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 6px 10px;
            font: inherit;
            cursor: pointer
        }
        
        label {
            display: block;
            margin: 8px 0;
            font-size: 13px
        }
        
        input[type=range] {
            width: 100%;
            accent-color: var(--ac)
        }
        
        .pill {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(120, 160, 220, .2)
        }
        
        .pill.responding {
            background: var(--ok);
            color: #04121f
        }
        
        .pill.dispatched {
            background: var(--warn);
            color: #04121f
        }
        
        .pill.reported {
            background: var(--bad);
            color: #fff
        }
        
        .al {
            border-left: 3px solid var(--ac);
            padding: 5px 8px;
            margin: 5px 0;
            font-size: 12px;
            background: rgba(70, 130, 210, .07);
            border-radius: 0 8px 8px 0
        }
        
        .al.crit {
            border-color: var(--bad)
        }
        
        .al.warn {
            border-color: var(--warn)
        }
        
        .al.ok {
            border-color: var(--ok)
        }
        
        .al small {
            margin-right: 6px
        }
        
        canvas.ch {
            width: 100%;
            height: 110px;
            display: block
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }
        
        td,
        th {
            padding: 4px;
            border-bottom: 1px solid var(--line);
            text-align: right
        }
        
        td:first-child,
        th:first-child {
            text-align: left
        }
        
        #toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translate(-50%, 30px);
            background: var(--ac);
            color: #04121f;
            padding: 8px 16px;
            border-radius: 20px;
            opacity: 0;
            transition: .25s;
            z-index: 60;
            pointer-events: none;
            font-weight: 600
        }
        
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }
        
        #scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 15
        }
        
        @media(max-width:900px) {
            .mob {
                display: inline-block
            }
            .note {
                display: none
            }
            #top {
                flex-wrap: wrap
            }
            #nav {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                padding-top: 56px;
                transform: translateX(-105%);
                transition: .25s;
                z-index: 40
            }
            body.navopen #nav {
                transform: none
            }
            #panel {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                height: 68vh;
                transform: translateY(105%);
                transition: transform .25s;
                z-index: 40;
                border-radius: 18px 18px 0 0;
                border-top: 1px solid var(--line)
            }
            body.pcol #panel {
                width: auto
            }
            body.panelopen #panel {
                transform: none
            }
            #panes {
                width: 100%;
                padding-top: 34px
            }
            #pClose {
                position: absolute;
                right: 8px;
                top: 6px;
                z-index: 3
            }
            body.navopen #scrim,
            body.panelopen #scrim {
                display: block
            }
            #mapctl {
                display: none
            }
            body.ctlopen #mapctl {
                display: flex
            }
            #ctlTog {
                position: absolute;
                right: 10px;
                bottom: 12px;
                z-index: 6;
                background: var(--glass)
            }
            body.ctlopen #ctlTog {
                bottom: calc(12px + 280px)
            }
            #insp {
                width: calc(100% - 70px);
                max-height: 36%
            }
            .kpi {
                min-width: 92px
            }
        }
        
        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none!important
            }
        }
        
        @keyframes fi {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
            to {
                opacity: 1;
                transform: none
            }
        }
        
        @keyframes pu {
            50% {
                opacity: .45
            }
        }
        
        .pane.active {
            animation: fi .28s ease
        }
        
        #insp:not([hidden]) {
            animation: fi .22s ease
        }
        
        #map {
            animation: fi .8s ease
        }
        
        .pill.reported {
            animation: pu 1s infinite
        }
        
        .btn:active,
        .ib:active,
        .kpi:active {
            transform: scale(.96)
        }
        
        .kpi,
        .btn,
        .ib {
            transition: transform .12s, border-color .2s, background .2s
        }
        
        #tour {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(0, 0, 0, .6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px
        }
        
        #tour .tc {
            max-width: 380px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--ac);
            border-radius: 16px;
            padding: 18px;
            animation: fi .3s ease
        }
        
        #tour p {
            color: var(--mut)
        }
        
        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none!important
            }
        }
    </style>
    <script>
        window.onerror = function(m, u, l) {
            var f = document.getElementById("fatal");
            if (f) {
                f.style.display = "block";
                f.textContent = "CityVerse error: " + m + " (" + (u || "").split("/").pop() + ":" + l + "). If files failed to load, extract the zip fully and open index.html from the extracted folder, or use CityVerse-standalone.html."
            }
        }
    </script>
</head>

<body><noscript><p style="padding:20px;color:#fff">CityVerse needs JavaScript enabled.</p></noscript>
    <div id="fatal" style="display:none;position:fixed;z-index:99;inset:auto 10px 10px 10px;background:#7a1330;color:#fff;padding:10px;border-radius:10px;font:13px system-ui"></div>
    <header id="top">
        <button class="ib mob" id="bNav" aria-label="Open modules">☰</button>
        <div class="logo"><svg width="26" height="26" viewBox="0 0 32 32"><rect x="3" y="14" width="7" height="14" fill="#27d3ff"/><rect x="12" y="6" width="8" height="22" fill="#3b82f6"/><rect x="22" y="11" width="7" height="17" fill="#27d3ff" opacity=".7"/></svg><b>City<span>Verse</span></b></div>
        <div class="clock" id="clock">Day 1 · 08:00</div>
        <button class="btn" id="bPlay">▶ Start</button><button class="btn" id="bReset" title="Reset simulation">↺</button>
        <select id="speed" title="Simulation speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
        <span class="sp"></span><span class="note">Local simulation · not connected to real infrastructure</span>
        <button class="ib" id="bPanel" aria-label="Toggle panel">▤</button></header>
    <div id="app">
        <nav id="nav"></nav>
        <main id="stage"><canvas id="map"></canvas>
            <div id="kpis"></div>
            <div id="hint" hidden></div>
            <div id="tip" hidden></div>
            <button class="ib mob" id="ctlTog" aria-label="Map controls">🧭</button>
            <div id="mapctl"><button class="ib" id="zi" title="Zoom in">＋</button><button class="ib" id="zo" title="Zoom out">－</button><button class="ib" id="zr" title="Reset view">⌖</button><button class="ib" id="zf" title="Fullscreen">⛶</button>
                <button class="ib on" data-l="city" title="City view">🏙️</button><button class="ib" data-l="traffic" title="Traffic layer">🚦</button><button class="ib" data-l="pollution" title="Pollution heatmap">🌫️</button><button class="ib" data-l="power"
                    title="Power grid layer">⚡</button><button class="ib" data-l="water" title="Water layer">💧</button></div>
            <div id="insp" hidden></div>
        </main>
        <aside id="panel"><button class="ib mob" id="pClose" aria-label="Close panel">×</button>
            <div id="panes"></div>
        </aside>
    </div>
    <div id="scrim"></div>
    <div id="toast"></div>
    <script>
        window.CV = window.CV || {};
        window.$ = id => document.getElementById(id);
        CV.DEF = {
            theme: 'dark',
            speed: 1,
            cycle: 6,
            cars: 60,
            conv: 100,
            inflow: 100,
            conservation: 10,
            curb: false,
            trees: 0,
            autoDispatch: true,
            random: true,
            showVehicles: true
        };
        CV.Storage = {
            k: 'cityverse.v1',
            load() {
                try {
                    return JSON.parse(localStorage.getItem(this.k)) || {}
                } catch (e) {
                    return {}
                }
            },
            save(d) {
                try {
                    localStorage.setItem(this.k, JSON.stringify(d))
                } catch (e) {}
            },
            clear() {
                try {
                    localStorage.removeItem(this.k)
                } catch (e) {}
            }
        };
        CV.saved = CV.Storage.load();
        CV.lastScen = CV.saved.scen || null;
        CV.cfg = Object.assign({}, CV.DEF, CV.saved.cfg);
        CV.save = () => CV.Storage.save({
            cfg: CV.cfg,
            closed: [...CV.Traffic.closed],
            hist: CV.Analytics.hist,
            t: CV.State.t,
            scen: CV.lastScen
        });
    </script>
    <script>
        (function() {
            const CV = window.CV,
                N = 13,
                T = 40;
            const ZN = [
                ['res', 'school', 'com', 'ind'],
                ['park', 'res', 'hosp', 'solar'],
                ['water', 'com', 'park', 'fire'],
                ['power', 'res', 'school', 'res']
            ];
            const NM = {
                res: 'Residential Block',
                com: 'Commercial Tower',
                ind: 'Factory',
                school: 'School',
                hosp: 'Hospital',
                fire: 'Fire Station',
                park: 'Park',
                solar: 'Solar Farm',
                water: 'Reservoir',
                power: 'Power Plant'
            };
            const MW = {
                res: 1.6,
                com: 2.5,
                ind: 4,
                school: .8,
                hosp: 2.5,
                fire: .5,
                park: .1,
                solar: 0,
                water: 1.5,
                power: 0
            };
            const HT = {
                res: 10,
                com: 20,
                ind: 12,
                school: 8,
                hosp: 16,
                fire: 9,
                park: 0,
                solar: 3,
                water: 0,
                power: 14
            };
            const COL = {
                res: '#5b8def',
                com: '#8a7dff',
                ind: '#c58a4a',
                school: '#f5b942',
                hosp: '#ff5c7a',
                fire: '#ff7a45',
                park: '#2ecf7a',
                solar: '#2a5fb5',
                water: '#2fa8ff',
                power: '#9aa7b5'
            };
            const SEC = ['North-West', 'North-East', 'South-West', 'South-East'];
            const tiles = [],
                grid = [],
                count = {},
                roads = [],
                cn = {};
            const hs = (i, j) => Math.abs((i * 73856093) ^ (j * 19349663)) % 100 / 100;
            for (let j = 0; j < N; j++) {
                grid[j] = [];
                for (let i = 0; i < N; i++) {
                    let t = null;
                    if (i % 3 && j % 3) {
                        const bx = i / 3 | 0,
                            by = j / 3 | 0,
                            z = ZN[by][bx];
                        cn[z] = (cn[z] || 0) + 1;
                        count[z] = cn[z];
                        t = {
                            i,
                            j,
                            type: z,
                            name: NM[z] + ' ' + cn[z],
                            mw: MW[z],
                            pop: z == 'res' ? 2200 + Math.round(hs(i, j) * 600) : 0,
                            sector: (by >> 1) * 2 + (bx >> 1),
                            outage: false,
                            h: HT[z] + (z == 'res' || z == 'com' ? Math.round(hs(j, i) * 10) : 0)
                        };
                        tiles.push(t)
                    } else roads.push([i, j]);
                    grid[j][i] = t
                }
            }
            let cv, ctx, raf = 0,
                P = null,
                cam = {
                    x: N * T / 2,
                    y: N * T / 2,
                    z: 1
                };
            const near = (list, i, j) => list.reduce((b, t) => {
                const a = Array.isArray(t) ? t : [t.i, t.j],
                    d = Math.abs(a[0] - i) + Math.abs(a[1] - j);
                return d < b.d ? {
                    d,
                    a
                } : b
            }, {
                d: 1e9
            }).a;
            const Map = CV.Map = {
                N,
                T,
                tiles,
                grid,
                count,
                roads,
                SEC,
                NM,
                COL,
                sel: null,
                mode: null,
                layer: 'city',
                isRoad: (i, j) => i >= 0 && j >= 0 && i < N && j < N && !grid[j][i],
                secOf: (i, j) => Math.min(1, (j / 3 | 0) >> 1) * 2 + Math.min(1, (i / 3 | 0) >> 1),
                nearRoad: (i, j) => near(roads, i, j),
                nearBld: (i, j) => near(tiles, i, j),
                invalidate() {
                    if (!raf) raf = requestAnimationFrame(draw)
                },
                themeChanged() {
                    P = null;
                    this.invalidate()
                },
                zoom(f) {
                    cam.z = Math.max(.4, Math.min(4, cam.z * f));
                    this.invalidate()
                },
                fit() {
                    cam.x = cam.y = N * T / 2;
                    cam.z = Math.min(cv.clientWidth, cv.clientHeight) / (N * T + 80) || 1;
                    this.invalidate()
                },
                focus(i, j) {
                    cam.x = (i + .5) * T;
                    cam.y = (j + .5) * T;
                    cam.z = Math.max(cam.z, 1.5);
                    this.sel = {
                        i,
                        j
                    };
                    CV.App.inspect(i, j);
                    this.invalidate()
                },
                setLayer(l) {
                    this.layer = l;
                    document.querySelectorAll('#mapctl [data-l]').forEach(b => b.classList.toggle('on', b.dataset.l == l));
                    this.invalidate()
                },
                setMode(m, label) {
                    this.mode = m;
                    const h = $('hint');
                    h.hidden = !m;
                    if (m) {
                        h.innerHTML = label + '<button id="hx">Done</button>';
                        $('hx').onclick = () => this.setMode(null)
                    }
                    cv.style.cursor = m ? 'crosshair' : 'grab'
                },
                draw() {
                    draw()
                },
                init() {
                    cv = $('map');
                    ctx = cv.getContext('2d');
                    const rs = () => {
                        const d = devicePixelRatio || 1;
                        cv.width = cv.clientWidth * d;
                        cv.height = cv.clientHeight * d;
                        this.invalidate()
                    };
                    let first = 1;
                    new ResizeObserver(() => {
                        rs();
                        if (first && cv.clientWidth) {
                            first = 0;

                        }
                    }).observe(cv);

                    let drag = null,
                        pinch = 0;
                    cv.onpointerdown = e => {
                        cv.setPointerCapture(e.pointerId);

                            x: e.clientX,
                            y: e.clientY
                        });

                            moved: 0
                        };
                        pinch = 0
                    };
                    cv.onpointermove = e => {
                        if (!ptrs.has(e.pointerId)) {
                            hover(e);
                            return
                        }

                            dx = e.clientX - p.x,
                            dy = e.clientY - p.y;

                        p.y = e.clientY;

                    });

                    $('zo').onclick = () => this.zoom(.8);

                }

            function pick(e) {
                const r = cv.getBoundingClientRect();
                return [Math.floor(((e.clientX - r.left - r.width / 2) / cam.z + cam.x) / T), Math.floor(((e.clientY - r.top - r.height / 2) / cam.z + cam.y) / T)]
            }

            function hover(e) {

                const r = $('stage').getBoundingClientRect();

                tp.style.top = e.clientY - r.top + 14 + 'px';

            const pal = () => P || (P = (s => {

            function box(x, y, w, h, c) {

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = p.bg;
                ctx.fillRect(0, 0, W, H);
                ctx.setTransform(cam.z * d, 0, 0, cam.z * d, W / 2 - cam.x * cam.z * d, H / 2 - cam.y * cam.z * d);
                ctx.fillStyle = p.ground;
                ctx.fillRect(-20, -20, N * T + 40, N * T + 40);
                for (const [i, j] of roads) {
                    const k = i + ',' + j;
                    ctx.fillStyle = p.road;
                    ctx.fillRect(i * T, j * T, T, T);
                    if (L == 'traffic') {
                        const v = Math.min(1, (Tr.dens[k] || 0) / 3);

                    }
                }

                        }

                    } else {

                            ctx.fillStyle = '#ffe9a0';
                            for (let a = 0; a < 3; a++) ctx.fillRect(x + 4 + a * 10, y - t.h + s + 3, 3, 3)
                        }
                    }
                    ctx.globalAlpha = 1;

                        ctx.font = '14px sans-serif';

                        ctx.fillText('⚡', x + s / 2, y + s / 2)
                    }
                }
                if (L == 'pollution') {
                    const q = CV.Env.pol;
                    for (let j = 0; j < N; j++)
                        for (let i = 0; i < N; i++) {
                            const v = q[j][i];
                            if (v > .01) {
                                ctx.fillStyle = `rgba(255,${Math.round(210-170*Math.min(1,v*2.5))},40,${Math.min(.6,v*1.6)})`;
                                ctx.fillRect(i * T, j * T, T, T)

                        }

                        const px = (v.x - .18 * v.dy) * T,

                        ctx.fillStyle = v.stop ? '#ff4d6d' : v.c;

                    }

                        const s = Tr.sigAt(i, j),
                            o = CV.Energy.out[Map.secOf(i, j)];

                    }

                    const x = (i + .5) * T,
                        y = (j + .5) * T,
                        r = 9 + (now / 70) % 10;

                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(em, x, y + 6)
                };

                for (const n of CV.Emergency.incidents) mark(n.i, n.j, CV.Emergency.IC[n.type], '#ff4d6d');

                    ctx.strokeStyle = p.ac;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(Map.sel.i * T + 1, Map.sel.j * T + 1, T - 2, T - 2)
                }
                for (const n of CV.Emergency.incidents)
                    for (const id of n.assigned) {
                        const u = CV.Emergency.units.find(x => x.id == id),
                            f = u.eta0 ? Math.max(0, 1 - u.eta / u.eta0) : 1,
                            x = (u.home.i + (n.i - u.home.i) * f + .5) * T,
                            y = (u.home.j + (n.j - u.home.j) * f + .5) * T;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(x, y, 8, 0, 7);
                        ctx.fill();
                        ctx.font = '11px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText({
                            fire: '🚒',
                            amb: '🚑',
                            pol: '🚓'
                        }[u.k], x, y + 4)
                    }
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                const nt = hr < 5 || hr >= 21 ? 1 : hr < 7 ? (7 - hr) / 2 : hr >= 19 ? (hr - 19) / 2 : 0;
                if (nt > 0 && L == 'city') {
                    ctx.fillStyle = `rgba(4,10,40,${.3*nt})`;
                    ctx.fillRect(0, 0, W, H)
                }
                if (CV.State.mods.rain > 1.2 || CV.Emergency.incidents.some(n => n.type == 'flood')) {
                    ctx.strokeStyle = 'rgba(150,200,255,.5)';
                    ctx.lineWidth = d;
                    ctx.beginPath();
                    for (let k = 0; k < 70; k++) {
                        const x = (k * 97 + now * .25) % W,
                            y = (k * 57 + now * .6) % H;
                        ctx.moveTo(x, y);
                        ctx.lineTo(x - 4 * d, y + 12 * d)
                    }
                    ctx.stroke()
                }
            }
        })();

    <script>
        (function() {
            const CV = window.CV,
                M = CV.Map,
                COLS = ['#27d3ff', '#ffd23d', '#ff7a45', '#e6edff', '#2ee59d'];
            const Tr = CV.Traffic = {
                vehicles: [],
                closed: new Set(),
                over: {},
                mode: 'auto',
                t: 0,
                cong: 0,
                avg: 0,
                stopped: 0,
                dens: {},
                series: [],
                init() {
                    this.vehicles = [];
                    this.closed = new Set(CV.saved.closed || []);
                    this.over = {};
                    this.mode = 'auto';
                    this.t = 0;
                    this.cong = 0;
                    this.dens = {};
                    this.series = [];
                    this.step()
                },
                sigAt(i, j) {
                    const m = this.over[i + ',' + j] || this.mode;
                    return m == 'auto' ? (Math.floor(this.t / CV.cfg.cycle) % 2 ? 'ew' : 'ns') : m
                },
                inter: (i, j) => i % 3 == 0 && j % 3 == 0,
                spawn() {
                    let i, j, k = 0;
                    do {
                        [i, j] = M.roads[Math.random() * M.roads.length | 0]
                    } while (this.closed.has(i + ',' + j) && ++k < 20);
                    const hor = j % 3 == 0 && (i % 3 != 0 || Math.random() < .5),
                        s = Math.random() < .5 ? 1 : -1;
                    this.vehicles.push({
                        x: i + .5,
                        y: j + .5,
                        dx: hor ? s : 0,
                        dy: hor ? 0 : s,
                        c: COLS[Math.random() * 5 | 0],
                        stop: 0,
                        sp: 1
                    })
                },
                turn(v, i, j) {
                    const o = [
                        [v.dx, v.dy],
                        [-v.dy, v.dx],
                        [v.dy, -v.dx]
                    ].filter(([x, y]) => M.isRoad(i + x, j + y) && !this.closed.has((i + x) + ',' + (j + y)));
                    if (!o.length) {
                        v.dx = -v.dx;
                        v.dy = -v.dy;
                        return
                    }
                    const st = o.find(d => d[0] == v.dx && d[1] == v.dy),
                        p = st && Math.random() < .6 ? st : o[Math.random() * o.length | 0];
                    v.dx = p[0];
                    v.dy = p[1];
                    v.x = i + .5;
                    v.y = j + .5
                },
                move(dt) {
                    this.t += dt;
                    const c = {};
                    for (const v of this.vehicles) {
                        const k = (v.x | 0) + ',' + (v.y | 0);
                        c[k] = (c[k] || 0) + 1
                    }
                    for (const v of this.vehicles) {
                        const ci = v.x | 0,
                            cj = v.y | 0,
                            n = c[ci + ',' + cj] || 1,
                            out = CV.Energy.out[M.secOf(ci, cj)];
                        const f = Math.max(.15, 1 - .17 * (n - 1)) * (out ? .6 : 1);
                        v.sp = f;
                        v.stop = 0;
                        const ds = Math.min(.25, 1.7 * f * dt),
                            nx = v.x + v.dx * ds,
                            ny = v.y + v.dy * ds,
                            ni = nx | 0,
                            nj = ny | 0;
                        if (ni != ci || nj != cj) {
                            if (!M.isRoad(ni, nj) || this.closed.has(ni + ',' + nj)) {
                                v.dx = -v.dx;
                                v.dy = -v.dy;
                                continue
                            }
                            if (this.inter(ni, nj) && !CV.Energy.out[M.secOf(ni, nj)] && this.sigAt(ni, nj) != (v.dx ? 'ew' : 'ns')) {
                                v.stop = 1;
                                continue
                            }
                        }
                        const s = v.dx + v.dy,
                            cx = (v.dx ? ni : nj) + .5,
                            a = v.dx ? v.x : v.y,
                            b = v.dx ? nx : ny;
                        v.x = nx;
                        v.y = ny;
                        if (this.inter(ni, nj) && (a - cx) * s < 0 && (b - cx) * s >= 0) this.turn(v, ni, nj)
                    }
                },
                step() {
                    const V = this.vehicles,
                        tg = Math.round(CV.cfg.cars * CV.State.mods.traffic * (.35 + .65 * CV.curve.tr(CV.hour())));
                    while (V.length < tg) this.spawn();
                    while (V.length > tg) V.shift();
                    this.stopped = V.filter(v => v.stop).length;
                    const raw = 100 * Math.min(1, .75 * this.stopped / Math.max(1, V.length) + .25 * Math.min(1, V.length / 160));
                    this.cong = this.cong * .7 + raw * .3;
                    this.avg = V.length ? Math.round(V.reduce((a, v) => a + v.sp * 45, 0) / V.length) : 0;
                    const c = {};
                    V.forEach(v => {
                        const k = (v.x | 0) + ',' + (v.y | 0);
                        c[k] = (c[k] || 0) + 1
                    });
                    for (const k in c) this.dens[k] = (this.dens[k] || 0) * .5 + c[k] * .5;
                    for (const k in this.dens)
                        if (!(k in c)) {
                            this.dens[k] *= .5;
                            if (this.dens[k] < .05) delete this.dens[k]
                        }
                    this.series.push(this.cong);
                    if (this.series.length > 60) this.series.shift();
                    if (this.cong > 60) CV.alert('warn', 'Heavy congestion: ' + Math.round(this.cong) + '% — adjust signals or reopen roads', 'cong')
                },
                close(i, j, b) {
                    const k = i + ',' + j;
                    b ? this.closed.add(k) : this.closed.delete(k);
                    if (b) this.vehicles = this.vehicles.filter(v => (v.x | 0) != i || (v.y | 0) != j)
                },
                toggleClosure(i, j) {
                    if (!M.isRoad(i, j)) return false;
                    const k = i + ',' + j,
                        b = !this.closed.has(k);
                    this.close(i, j, b);
                    CV.alert('info', (b ? 'Road closed at ' : 'Road reopened at ') + `(${i},${j})`);
                    CV.save();
                    CV.App.refresh();
                    return true
                },
                panel(el) {
                    el.innerHTML = `<h3>🚦 Traffic Management</h3><div class="g2"><div class="card"><small>Congestion</small><b class="big" id="tr-c"></b></div><div class="card"><small>Vehicles</small><b class="big" id="tr-v"></b></div><div class="card"><small>Avg speed</small><b class="big" id="tr-s"></b></div><div class="card"><small>Closed roads</small><b class="big" id="tr-x"></b></div></div>
<div class="card"><small>Signal control (all intersections)</small><div class="seg" id="tr-mode"><button data-m="auto">Auto</button><button data-m="ns">North–South green</button><button data-m="ew">East–West green</button></div><label>Cycle length: <b id="tr-cv"></b> s<input type="range" id="tr-cyc" min="3" max="15"></label><small>Tip: click an intersection on the map to override one signal.</small></div>
<div class="card"><div class="seg"><button class="btn" id="tr-close">🚧 Close roads on map</button><button class="btn" id="tr-clear">Reopen all</button></div><label>Traffic volume: <b id="tr-nv"></b> vehicles<input type="range" id="tr-cars" min="10" max="200"></label></div>
<div class="card"><small>Congestion, last 60 ticks</small><canvas class="ch" id="tr-ch"></canvas></div><div class="card"><small>Traffic density by district</small><div id="tr-sec"></div></div>`;
                    $('tr-mode').onclick = e => {
                        const m = e.target.dataset.m;
                        if (!m) return;
                        this.mode = m;
                        this.over = {};
                        CV.App.refresh()
                    };
                    $('tr-cyc').oninput = e => {
                        CV.cfg.cycle = +e.target.value;
                        CV.save();
                        this.refresh()
                    };
                    $('tr-cars').oninput = e => {
                        CV.cfg.cars = +e.target.value;
                        CV.save();
                        this.refresh()
                    };
                    $('tr-close').onclick = () => {
                        CV.Map.setMode('close', 'Click roads to close / reopen them');
                        if (innerWidth <= 900) document.body.classList.remove('panelopen')
                    };
                    $('tr-clear').onclick = () => {
                        this.closed.clear();
                        CV.toast('All roads reopened');
                        CV.save();
                        CV.App.refresh()
                    };
                    $('tr-cyc').value = CV.cfg.cycle;
                    $('tr-cars').value = CV.cfg.cars
                },
                refresh() {
                    if (!$('tr-c')) return;
                    $('tr-c').textContent = Math.round(this.cong) + '%';
                    $('tr-v').textContent = this.vehicles.length;
                    $('tr-s').textContent = this.avg + ' km/h';
                    $('tr-x').textContent = this.closed.size;
                    $('tr-cv').textContent = CV.cfg.cycle;
                    $('tr-nv').textContent = CV.cfg.cars;
                    document.querySelectorAll('#tr-mode button').forEach(b => b.classList.toggle('on', b.dataset.m == this.mode));
                    const s = [0, 0, 0, 0];
                    this.vehicles.forEach(v => s[M.secOf(v.x | 0, v.y | 0)]++);
                    const tot = Math.max(1, this.vehicles.length);
                    $('tr-sec').innerHTML = CV.bars(s.map((n, i) => ({
                        l: M.SEC[i],
                        v: 100 * n / tot * 2,
                        t: n + ' veh',
                        c: n / tot > .3 ? 'var(--warn)' : ''
                    })));
                    CV.Charts.line($('tr-ch'), [{
                        d: this.series,
                        c: '#ffb83d'
                    }], {
                        min: 0,
                        max: 100
                    })
                }
            };
        })();
    </script>
    <script>
        (function() {
            const CV = window.CV,
                M = CV.Map;
            const E = CV.Energy = {
                out: [0, 0, 0, 0],
                tm: [0, 0, 0, 0],
                solar: 0,
                conv: 0,
                demand: 0,
                deficit: 0,
                renew: 0,
                eff: 100,
                sec: [0, 0, 0, 0],
                mwh: 0,
                co2: 0,
                sD: [],
                sS: [],
                sSol: [],
                init() {
                    this.out = [0, 0, 0, 0];
                    this.tm = [0, 0, 0, 0];
                    M.tiles.forEach(t => t.outage = false);
                    this.mwh = this.co2 = 0;
                    this.sD = [];
                    this.sS = [];
                    this.sSol = [];
                    this.step(true)
                },
                setOutage(s, b, auto) {
                    this.out[s] = b ? 1 : 0;
                    this.tm[s] = b && auto ? 8 : 0;
                    M.tiles.forEach(t => {
                        if (t.sector == s) t.outage = !!b
                    });
                    CV.alert(b ? 'crit' : 'ok', b ? 'Power outage in ' + M.SEC[s] + ' district' : 'Power restored in ' + M.SEC[s] + ' district')
                },
                step(init) {
                    const h = CV.hour(),
                        m = CV.State.mods;
                    let dem = 0;
                    this.sec = [0, 0, 0, 0];
                    for (const t of M.tiles) {
                        if (t.outage || !t.mw) continue;
                        let w = t.mw * CV.curve.dem(h) * m.demand;
                        if (t.type == 'ind') w *= m.ind * (CV.cfg.curb ? .6 : 1);
                        dem += w;
                        this.sec[t.sector] += w
                    }
                    const sol = Math.min(dem, M.count.solar * 8 * CV.curve.sun(h) * m.solar),
                        cap = M.count.power * 20 * CV.cfg.conv / 100,
                        conv = Math.max(0, Math.min(cap, dem - sol));
                    this.demand = dem;
                    this.solar = sol;
                    this.conv = conv;
                    this.deficit = Math.max(0, dem - sol - conv);
                    this.renew = sol + conv > 0 ? 100 * sol / (sol + conv) : 0;
                    this.eff = dem > 0 ? Math.round(Math.min(1, (sol + conv) / dem) * (70 + 30 * this.renew / 100)) : 100;
                    if (init) return;
                    const dh = 5 / 60;
                    this.mwh += (sol + conv) * dh;
                    this.co2 += conv * dh * .75;
                    if (h < .1) {
                        this.mwh = this.co2 = 0
                    }
                    for (let s = 0; s < 4; s++)
                        if (this.out[s] && this.tm[s] > 0 && --this.tm[s] == 0) this.setOutage(s, false);
                    this.sD.push(dem);
                    this.sS.push(sol + conv);
                    this.sSol.push(sol);
                    [this.sD, this.sS, this.sSol].forEach(a => {
                        if (a.length > 48) a.shift()
                    });
                    if (this.deficit > .5) CV.alert('crit', 'Power shortage of ' + this.deficit.toFixed(1) + ' MW — raise conventional limit', 'def')
                },
                panel(el) {
                    el.innerHTML = `<h3>⚡ Energy Management</h3><div class="g2"><div class="card"><small>Demand</small><b class="big" id="en-d"></b></div><div class="card"><small>Supply</small><b class="big" id="en-s"></b></div><div class="card"><small>Solar</small><b class="big" id="en-so"></b></div><div class="card"><small>Conventional</small><b class="big" id="en-c"></b></div><div class="card"><small>Renewable share</small><b class="big" id="en-r"></b></div><div class="card"><small>Efficiency</small><b class="big" id="en-e"></b></div></div>
<div class="card"><label>Conventional capacity limit: <b id="en-lv"></b>%<input type="range" id="en-lim" min="20" max="100" step="5"></label><small id="en-x"></small></div>
<div class="card"><small>Power distribution by district</small><div id="en-sec"></div></div><div class="card"><small>Usage, last 4 hours (demand / supply / solar, MW)</small><canvas class="ch" id="en-ch"></canvas></div>`;
                    $('en-lim').oninput = e => {
                        CV.cfg.conv = +e.target.value;
                        CV.save();
                        CV.Energy.step(true);
                        CV.App.refresh()
                    };
                    $('en-lim').value = CV.cfg.conv;
                    $('en-sec').onclick = e => {
                        const s = e.target.dataset.s;
                        if (s == null) return;
                        this.setOutage(+s, !this.out[+s]);
                        CV.App.refresh()
                    }
                },
                refresh() {
                    if (!$('en-d')) return;
                    const f = (id, v) => $(id).textContent = v;
                    f('en-d', this.demand.toFixed(1) + ' MW');
                    f('en-s', (this.solar + this.conv).toFixed(1) + ' MW');
                    f('en-so', this.solar.toFixed(1) + ' MW');
                    f('en-c', this.conv.toFixed(1) + ' MW');
                    f('en-r', Math.round(this.renew) + '%');
                    f('en-e', this.eff + '%');
                    f('en-lv', CV.cfg.conv);
                    $('en-x').textContent = `Deficit ${this.deficit.toFixed(1)} MW · energy today ${this.mwh.toFixed(0)} MWh · CO₂ ${this.co2.toFixed(1)} t`;
                    $('en-sec').innerHTML = M.SEC.map((n, i) => `<div class="row"><span>${n}</span><div class="bar"><i style="width:${Math.min(100,this.sec[i]*3.5)}%;background:${this.out[i]?'var(--bad)':''}"></i></div><em>${this.out[i]?'<span class=bad>OUT</span>':this.sec[i].toFixed(1)+' MW'}</em></div><div class="seg"><button data-s="${i}">${this.out[i]?'🔌 Restore power':'⚡ Simulate outage'}</button></div>`).join('');
                    CV.Charts.line($('en-ch'), [{
                        d: this.sD,
                        c: '#ff4d6d'
                    }, {
                        d: this.sS,
                        c: '#27d3ff'
                    }, {
                        d: this.sSol,
                        c: '#ffd23d'
                    }], {
                        min: 0
                    })
                }
            };
        })();
    </script>
    <script>
        (function() {
                const CV = window.CV,
                    M = CV.Map;
                const W = CV.Water = {
                        CAP: 10,
                        level: 7,
                        supply: 0,
                        demand: 0,
                        raw: 0,
                        loss: 0,
                        ratio: 1,
                        leaks: [],
                        saved: 0,
                        lpcd: 0,
                        pr: [0, 0, 0, 0],
                        s1: [],
                        s2: [],
                        nid: 1,
                        init() {
                            this.level = 7;
                            this.leaks = [];
                            this.saved = 0;
                            this.s1 = [];
                            this.s2 = [];
                            this.ratio = 1;
                            this.calc()
                        },
                        calc() {
                            const S = CV.State,
                                m = S.mods,
                                c = CV.cfg.conservation / 100;
                            this.raw = S.pop * 1.1e-5 * CV.curve.wat(CV.hour()) * m.water;
                            this.demand = this.raw * (1 - c);
                            this.supply = .45 * CV.cfg.inflow / 100 * m.rain;
                            this.loss = this.leaks.length * .05;
                            this.lpcd = Math.round(this.demand * 24 * 1e6 / Math.max(1, S.pop))
                        },
                        step() {
                            this.calc();
                            const dt = 5 / 60,
                                av = this.level + this.supply * dt,
                                need = (this.demand + this.loss) * dt;
                            if (av >= need) {
                                this.level = Math.min(this.CAP, av - need);
                                this.ratio = 1
                            } else {
                                this.level = 0;
                                this.ratio = av / need
                            }
                            this.saved += (this.raw - this.demand) * dt;
                            this.leaks.forEach(l => {
                                if (l.fix > 0 && --l.fix == 0) l.done = 1
                            });
                            const d = this.leaks.filter(l => l.done);
                            if (d.length) {
                                this.leaks = this.leaks.filter(l => !l.done);
                                CV.alert('ok', 'Leak repaired — pipe restored')
                            }
                            const p = this.level / this.CAP;
                            if (p < .2) CV.alert(p < .1 ? 'crit' : 'warn', 'Reservoir at ' + Math.round(p * 100) + '%', 'wl');
                            if (this.ratio < 1) CV.alert('crit', 'Water rationing: ' + Math.round(this.ratio * 100) + '% of demand served', 'wr');
                            this.pr = [0, 1, 2, 3].map(s => Math.max(5, Math.round(60 * (.4 + .6 * this.ratio) * (.65 + .35 * Math.min(1, p * 3)) - 5 * this.leaks.filter(l => M.secOf(l.i, l.j) == s).length)));
                            this.s1.push(this.demand + this.loss);
                            this.s2.push(this.supply);
                            [this.s1, this.s2].forEach(a => {
                                if (a.length > 48) a.shift()
                            })
                        },
                        addLeak(i, j) {
                            const [a, b] = M.isRoad(i, j) ? [i, j] : M.nearRoad(i, j);
                            if (this.leaks.some(l => l.i == a && l.j == b)) {
                                CV.toast('A leak already exists there');
                                return
                            }
                            this.leaks.push({
                                id: this.nid++,
                                i: a,
                                j: b,
                                fix: 0
                            });
                            CV.alert('warn', `Water leak detected at (${a},${b}) in ${M.SEC[M.secOf(a,b)]} district`);
                            CV.App.refresh()
                        },
                        panel(el) {
                            el.innerHTML = `<h3>💧 Water Management</h3><div class="card"><div class="row2"><small>Reservoir level</small><b id="wa-p"></b></div><div class="bar"><i id="wa-b"></i></div></div>
<div class="g2"><div class="card"><small>Demand</small><b class="big" id="wa-d"></b></div><div class="card"><small>Supply</small><b class="big" id="wa-s"></b></div><div class="card"><small>Per person</small><b class="big" id="wa-l"></b></div><div class="card"><small>Water saved</small><b class="big" id="wa-v"></b></div></div>
<div class="card"><label>Conservation target: <b id="wa-cv"></b>% less demand<input type="range" id="wa-con" min="0" max="30"></label><label>Treatment inflow: <b id="wa-iv"></b>%<input type="range" id="wa-in" min="50" max="150" step="5"></label></div>
<div class="card"><small>Distribution pressure (psi)</small><div id="wa-pr"></div></div>
<div class="card"><div class="row2"><small>Leakage incidents</small><span class="seg"><button class="btn" id="wa-rl">🎲 Random</button><button class="btn" id="wa-pl">📍 Place</button></span></div><div id="wa-lk"></div></div>
<div class="card"><small>Demand vs supply (ML/h)</small><canvas class="ch" id="wa-ch"></canvas></div>`;
                            $('wa-con').oninput = e => {
                                CV.cfg.conservation = +e.target.value;
                                CV.save();
                                this.calc();
                                CV.App.refresh()
                            };
                            $('wa-in').oninput = e => {
                                CV.cfg.inflow = +e.target.value;
                                CV.save();
                                this.calc();
                                CV.App.refresh()
                            };
                            $('wa-con').value = CV.cfg.conservation;
                            $('wa-in').value = CV.cfg.inflow;
                            $('wa-rl').onclick = () => this.addLeak(...M.roads[Math.random() * M.roads.length | 0]);
                            $('wa-pl').onclick = () => {
                                M.setMode('leak', 'Click a road to create a leak');
                                if (innerWidth <= 900) document.body.classList.remove('panelopen')
                            };
                            $('wa-lk').onclick = e => {
                                const i = e.target.dataset.r;
                                if (!i) return;
                                const l = this.leaks.find(x => x.id == +i);
                                if (l) {
                                    l.fix = 6;
                                    CV.toast('Repair crew dispatched');
                                    CV.App.refresh()
                                }
                            }
                        },
                        refresh() {
                            if (!$('wa-p')) return;
                            const p = Math.round(100 * this.level / this.CAP);
                            $('wa-p').textContent = p + '% (' + this.level.toFixed(1) + ' ML)';
                            $('wa-b').style.width = p + '%';
                            $('wa-b').style.background = p < 20 ? 'var(--bad)' : p < 40 ? 'var(--warn)' : '';
                            $('wa-d').textContent = this.demand.toFixed(2) + ' ML/h';
                            $('wa-s').textContent = this.supply.toFixed(2) + ' ML/h';
                            $('wa-l').textContent = this.lpcd + ' L/day';
                            $('wa-v').textContent = this.saved.toFixed(1) + ' ML';
                            $('wa-cv').textContent = CV.cfg.conservation;
                            $('wa-iv').textContent = CV.cfg.inflow;
                            $('wa-pr').innerHTML = CV.bars(M.SEC.map((n, i) => ({
                                l: n,
                                v: this.pr[i] / 70 * 100,
                                t: this.pr[i] + ' psi',
                                c: this.pr[i] < 35 ? 'var(--bad)' : ''
                            })));
                            $('wa-lk').innerHTML = this.leaks.length ? this.leaks.map(l => `<div class="row2"><span>Leak #${l.id} · (${l.i},${l.j})</span>${l.fix?`<small>repairing… ${l.fix}</small>`:`<button class="btn" data-r="${l.id}">🔧 Repair</button>`}</div>`).join(''):'<div class="empty">No leaks detected. Distribution is healthy.</div>';
CV.Charts.line($('wa-ch'),[{d:this.s1,c:'#ff7a45'},{d:this.s2,c:'#2fa8ff'}],{min:0})}};
})();
    </script>
    <script>
        (function() {
            const CV = window.CV,
                M = CV.Map,
                N = M.N;
            const Z = () => Array.from({
                length: N
            }, () => Array(N).fill(0));
            const CAT = a => a <= 50 ? ['Good', 'var(--ok)'] : a <= 100 ? ['Moderate', 'var(--warn)'] : a <= 150 ? ['Unhealthy (sensitive)', '#ff8a3d'] : a <= 200 ? ['Unhealthy', 'var(--bad)'] : ['Hazardous', '#c026d3'];
            const V = CV.Env = {
                pol: Z(),
                aqi: 50,
                noise: 45,
                green: 12,
                wind: [1, 0],
                s1: [],
                s2: [],
                init() {
                    this.pol = Z();
                    this.wind = [1, 0];
                    this.s1 = [];
                    this.s2 = [];
                    for (let k = 0; k < 20; k++) this.step(true)
                },
                step(init) {
                    const m = CV.State.mods,
                        e = Z();
                    for (const k in CV.Traffic.dens) {
                        const [i, j] = k.split(',');
                        e[j][i] += CV.Traffic.dens[k] * .012 * m.pol
                    }
                    for (const t of M.tiles) {
                        if (t.type == 'ind') e[t.j][t.i] += .06 * m.pol * m.ind * (CV.cfg.curb ? .5 : 1);
                        if (t.type == 'power') e[t.j][t.i] += .06 * Math.min(1, CV.Energy.conv / 80)
                    }
                    for (const n of CV.Emergency.incidents)
                        if (n.type == 'fire') e[n.j][n.i] += .1 * n.sev;
                    if (!init && CV.State.t % 120 == 0 && Math.random() < .4) this.wind = [
                        [1, 0],
                        [-1, 0],
                        [0, 1],
                        [0, -1]
                    ][Math.random() * 4 | 0];
                    const p = this.pol,
                        q = Z(),
                        [wx, wy] = this.wind;
                    for (let j = 0; j < N; j++)
                        for (let i = 0; i < N; i++) {
                            let s = 0,
                                c = 0;
                            for (const [a, b] of[[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                                const x = i + a,
                                    y = j + b;
                                if (x >= 0 && y >= 0 && x < N && y < N) {
                                    s += p[y][x];
                                    c++
                                }
                            }
                            const ux = i - wx,
                                uy = j - wy,
                                up = ux >= 0 && uy >= 0 && ux < N && uy < N ? p[uy][ux] : 0;
                            let v = (p[j][i] * .55 + s / c * .3 + up * .15) * .96 + e[j][i];
                            const t = M.grid[j][i];
                            if (t && t.type == 'park') v *= .9;
                            q[j][i] = Math.min(1, v)
                        }
                    this.pol = q;
                    this.green = Math.min(60, M.count.park / 64 * 100 + CV.cfg.trees * .5);
                    let mean = 0;
                    q.forEach(r => r.forEach(v => mean += v));
                    mean /= N * N;
                    this.aqi = Math.max(10, Math.min(500, Math.round((20 + 330 * mean) * (1 - this.green / 250))));
                    const h = CV.hour();
                    this.noise = Math.round(Math.min(110, 40 + 30 * Math.min(1, CV.Traffic.vehicles.length / 150) + 6 * CV.State.mods.ind - (h < 6 || h >= 22 ? 6 : 0)));
                    if (init) return;
                    this.s1.push(this.aqi);
                    this.s2.push(this.noise);
                    [this.s1, this.s2].forEach(a => {
                        if (a.length > 48) a.shift()
                    });
                    if (this.aqi > 150) CV.alert('crit', 'Air quality ' + CV.aqiCat(this.aqi) + ' (AQI ' + this.aqi + ')', 'aqi');
                    else if (this.aqi > 100) CV.alert('warn', 'Air quality is unhealthy for sensitive groups (AQI ' + this.aqi + ')', 'aqi');
                    if (this.noise > 75) CV.alert('warn', 'Noise level high: ' + this.noise + ' dB', 'noi')
                },
                panel(el) {
                    el.innerHTML = `<h3>🌿 Environmental Monitoring</h3><div class="card"><small>Air quality index</small><b class="big" id="ev-a"></b><small id="ev-ac"></small></div>
<div class="g2"><div class="card"><small>Noise</small><b class="big" id="ev-n"></b></div><div class="card"><small>Green coverage</small><b class="big" id="ev-g"></b></div><div class="card"><small>Wind</small><b class="big" id="ev-w"></b></div><div class="card"><small>Trees planted</small><b class="big" id="ev-t"></b></div></div>
<div class="card"><div class="seg"><button class="btn" id="ev-heat">🌫️ Show heatmap</button><button class="btn" id="ev-tree">🌳 Plant 10 trees</button></div><label><input type="checkbox" id="ev-curb"> Emission curbs on factories (−50% pollution, −40% power)</label></div>
<div class="card"><small>AQI and noise (dB), last 4 hours</small><canvas class="ch" id="ev-ch"></canvas></div>`;
                    $('ev-heat').onclick = () => {
                        M.setLayer('pollution');
                        CV.toast('Pollution heatmap on the map');
                        if (innerWidth <= 900) document.body.classList.remove('panelopen')
                    };
                    $('ev-tree').onclick = () => {
                        CV.cfg.trees += 10;
                        CV.save();
                        CV.toast('10 trees planted');
                        CV.Env.step(true);
                        CV.App.refresh()
                    };
                    $('ev-curb').checked = CV.cfg.curb;
                    $('ev-curb').onchange = e => {
                        CV.cfg.curb = e.target.checked;
                        CV.save();
                        CV.Energy.step(true);
                        CV.App.refresh()
                    }
                },
                refresh() {
                    if (!$('ev-a')) return;
                    const c = CAT(this.aqi);
                    $('ev-a').textContent = this.aqi;
                    $('ev-a').style.color = c[1];
                    $('ev-ac').textContent = c[0];
                    $('ev-n').textContent = this.noise + ' dB';
                    $('ev-g').textContent = this.green.toFixed(1) + '%';
                    $('ev-w').textContent = {
                        '1,0': '→ East',
                        '-1,0': '← West',
                        '0,1': '↓ South',
                        '0,-1': '↑ North'
                    }[this.wind.join()];
                    $('ev-t').textContent = CV.cfg.trees;
                    CV.Charts.line($('ev-ch'), [{
                        d: this.s1,
                        c: '#ff4d6d'
                    }, {
                        d: this.s2,
                        c: '#8a7dff'
                    }], {
                        min: 0
                    })
                }
            };
            CV.aqiCat = a => CAT(a)[0];
        })();
    </script>
    <script>
        (function() {
                const CV = window.CV,
                    M = CV.Map;
                const NEED = {
                        fire: ['fire', 'fire'],
                        flood: ['pol', 'pol'],
                        accident: ['amb', 'pol'],
                        medical: ['amb']
                    },
                    BASE = {
                        fire: 14,
                        flood: 20,
                        accident: 8,
                        medical: 6
                    },
                    KN = {
                        fire: 'Fire trucks',
                        amb: 'Ambulances',
                        pol: 'Police / rescue'
                    };
                const rnd = a => a[Math.random() * a.length | 0];
                const E = CV.Emergency = {
                        IC: {
                            fire: '🔥',
                            flood: '🌊',
                            accident: '🚗',
                            medical: '🚑'
                        },
                        incidents: [],
                        units: [],
                        resolved: 0,
                        resp: [],
                        nid: 1,
                        sel: 'fire',
                        init() {
                            this.incidents = [];
                            this.resolved = 0;
                            this.resp = [];
                            this.nid = 1;
                            let u = 1;
                            this.units = [];
                            M.tiles.filter(t => t.type == 'fire').forEach(t => this.units.push({
                                id: u++,
                                k: 'fire',
                                home: t,
                                busy: 0,
                                eta: 0
                            }));
                            M.tiles.filter(t => t.type == 'hosp').forEach(t => this.units.push({
                                id: u++,
                                k: 'amb',
                                home: t,
                                busy: 0,
                                eta: 0
                            }));
                            M.tiles.filter(t => t.type == 'com').slice(0, 4).forEach(t => this.units.push({
                                id: u++,
                                k: 'pol',
                                home: t,
                                busy: 0,
                                eta: 0
                            }))
                        },
                        create(type, i, j, sev) {
                            let a = i,
                                b = j;
                            if (type == 'accident' && !M.isRoad(i, j))[a, b] = M.nearRoad(i, j);
                            if (type == 'fire' && M.isRoad(i, j))[a, b] = M.nearBld(i, j);
                            const t = M.grid[b][a],
                                n = {
                                    id: this.nid++,
                                    type,
                                    i: a,
                                    j: b,
                                    sev: sev || 1 + (Math.random() * 3 | 0),
                                    age: 0,
                                    progress: 0,
                                    need: NEED[type].slice(),
                                    assigned: [],
                                    resp: null,
                                    closed: false,
                                    status: 'reported',
                                    name: t ? t.name : `Road (${a},${b})`
                                };
                            if ((type == 'accident' || type == 'flood') && M.isRoad(a, b) && !CV.Traffic.closed.has(a + ',' + b)) {
                                CV.Traffic.close(a, b, true);
                                n.closed = true
                            }
                            this.incidents.push(n);
                            CV.alert('crit', `${this.IC[type]} ${type} reported at ${n.name}`);
                            if (CV.cfg.autoDispatch) this.dispatch(n);
                            CV.App.refresh();
                            return n
                        },
                        dispatch(n) {
                            const miss = n.need.slice();
                            n.assigned.forEach(id => {
                                const x = miss.indexOf(this.units.find(u => u.id == id).k);
                                if (x >= 0) miss.splice(x, 1)
                            });
                            n.short = false;
                            for (const k of miss) {
                                let best = null,
                                    bd = 1e9;
                                for (const u of this.units)
                                    if (u.k == k && !u.busy) {
                                        const d = Math.abs(u.home.i - n.i) + Math.abs(u.home.j - n.j);
                                        if (d < bd) {
                                            bd = d;
                                            best = u
                                        }
                                    }
                                if (best) {
                                    best.busy = n.id;
                                    best.eta = Math.ceil(bd / 3) + 1;
                                    best.eta0 = best.eta;
                                    n.assigned.push(best.id)
                                } else n.short = true
                            }
                            if (n.assigned.length && n.status == 'reported') n.status = 'dispatched';
                            return n.assigned.length
                        },
                        end(n, ok) {
                            this.units.forEach(u => {
                                if (u.busy == n.id) {
                                    u.busy = 0;
                                    u.eta = 0
                                }
                            });
                            if (n.closed) CV.Traffic.close(n.i, n.j, false);
                            this.incidents = this.incidents.filter(x => x != n);
                            if (ok) {
                                this.resolved++;
                                CV.alert('ok', `${n.type} at ${n.name} resolved`)
                            } else CV.alert('info', `Incident #${n.id} cancelled`)
                        },
                        step() {
                            for (const n of this.incidents.slice()) {
                                n.age++;

                                let arr = 0;

                                    if (u.eta > 0) u.eta--;

                                });
                                if (arr && n.resp == null) {
                                    n.resp = n.age;
                                    this.resp.push(n.age)
                                }
                                if (arr) {
                                    n.progress += 100 / (BASE[n.type] * (.7 + .3 * n.sev)) * arr / n.need.length;
                                    n.status = 'responding'
                                } else {
                                    n.status = n.assigned.length ? 'dispatched' : 'reported';
                                    if (n.age % 6 == 0 && n.sev < 3) {
                                        n.sev++;
                                        CV.alert('warn', `Incident #${n.id} is escalating (severity ${n.sev})`)
                                    }
                                }
                                if (n.progress >= 100) this.end(n, true)
                            }
                        },
                        panel(el) {

                            el.innerHTML = `<h3>🚨 Emergency Management</h3><div class="g2"><div class="card"><small>Active</small><b class="big" id="em-a"></b></div><div class="card"><small>Resolved</small><b class="big" id="em-r"></b></div><div class="card"><small>Avg response</small><b class="big" id="em-t"></b></div><div class="card"><small>Units busy</small><b class="big" id="em-u"></b></div></div>
<div class="card"><small>Create incident</small><div class="seg" id="em-ty">${Object.keys(this.IC).map(k=>`<button data-t="${k}">${this.IC[k]} ${k}</button>`).join('')}</div><div class="seg"><button class="btn" id="em-pl">📍 Place on map</button><button class="btn" id="em-rd">🎲 Random location</button></div><label><input type="checkbox" id="em-au"> Auto-dispatch nearest units</label></div>
<div id="em-ls"></div><div class="card"><small>Rescue resources</small><div id="em-un"></div></div>
<div class="card"><small>Fire stations and hospitals</small>${M.tiles.filter(t=>t.type=='fire'||t.type=='hosp').map(t=>`<div class="row2"><span>${t.type=='fire'?'🚒':'🏥'} ${t.name}</span><button class="btn" data-f="${t.i},${t.j}">Locate</button></div>`).join('')}</div>`;
$('em-ty').onclick=e=>{if(e.target.dataset.t){this.sel=e.target.dataset.t;this.refresh()}};
$('em-pl').onclick=()=>{M.setMode('inc:'+this.sel,'Click the map to place: '+this.sel);if(innerWidth<=900)document.body.classList.remove('panelopen')};

$('em-au').checked=CV.cfg.autoDispatch;$('em-au').onchange=e=>{CV.cfg.autoDispatch=e.target.checked;CV.save()};
el.onclick=e=>{const d=e.target.dataset;if(d.f){const[i,j]=d.f.split(',').map(Number);M.focus(i,j)}else if(d.a){const n=this.incidents.find(x=>x.id==+d.i);if(!n)return;if(d.a=='d'){CV.toast(this.dispatch(n)?'Units dispatched':'No free units available');}else this.end(n,false);CV.App.refresh()}}},
refresh(){if(!$('em-a'))return;const b=this.units.filter(u=>u.busy).length;$('em-a').textContent=this.incidents.length;$('em-r').textContent=this.resolved;$('em-t').textContent=this.resp.length?Math.round(this.resp.reduce((a,x)=>a+x,0)/this.resp.length*5)+' min':'–';$('em-u').textContent=b+'/'+this.units.length;
